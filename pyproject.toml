[project]
name = "linknest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "sqlmodel>=0.0.48",
]

[project.scripts]
linknest = "linknest:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
